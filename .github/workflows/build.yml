name: build-and-verify

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      toolset-version:
        description: 'For example v3.12-r1 or v3.12-preview.2'
        required: true
        default: 'v3.12-test'
        type: string

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  # Resolve and validate the requested toolset version.
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      toolset-version: ${{ steps.version.outputs.toolsetVersion }}
      upstream-version: ${{ steps.version.outputs.upstreamVersion }}
      upstream-config: ${{ steps.version.outputs.upstreamConfig }}
      source-date-epoch: ${{ steps.version.outputs.sourceDateEpoch }}
      windows-archive: ${{ steps.version.outputs.windowsArchive }}
      source-archive: ${{ steps.version.outputs.sourceArchive }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - id: version
        name: resolve version and upstream configuration.
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.toolset-version || github.ref_name }}
        run: python -m build_tools.toolset_cli resolve-version --version "$REQUESTED_VERSION" --github-output "$GITHUB_OUTPUT"

  # Download and verify both upstream archives once.
  download:
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Download and verify
        run: python -m build_tools.toolset_cli --upstream-config "${{ needs.resolve.outputs.upstream-config }}" --toolset-version "${{ needs.resolve.outputs.toolset-version }}" download --cache artifacts/upstream
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: verified-upstream
          path: artifacts/upstream
          if-no-files-found: error
          retention-days: 2

  # Stage common data and validate the official Windows x86 compiler.
  windows-host:
    needs: [resolve, download]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: verified-upstream
          path: artifacts/upstream
      - name: Stage common files and write root launchers
        run: python -m build_tools.toolset_cli --upstream-config "${{ needs.resolve.outputs.upstream-config }}" --toolset-version "${{ needs.resolve.outputs.toolset-version }}" stage-common --archive "artifacts/upstream/${{ needs.resolve.outputs.windows-archive }}" --stage artifacts/stage --work artifacts/work
      - name: Stage and validate the official Windows x86 host
        run: python -m build_tools.toolset_cli --upstream-config "${{ needs.resolve.outputs.upstream-config }}" --toolset-version "${{ needs.resolve.outputs.toolset-version }}" stage-windows-host --archive "artifacts/upstream/${{ needs.resolve.outputs.windows-archive }}" --stage artifacts/stage --work artifacts/work
      - name: Verify and compile through the root Windows launcher
        run: python -m build_tools.ci_cli --upstream-config "${{ needs.resolve.outputs.upstream-config }}" --toolset-version "${{ needs.resolve.outputs.toolset-version }}" windows-smoke --stage artifacts/stage --fixture fixtures/minimal.nsi --smoke artifacts/smoke
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-stage
          path: artifacts/stage
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: installer-win-x86
          path: artifacts/smoke/smoke-installer.exe
          if-no-files-found: error
          retention-days: 2

  # Build and smoke-test each native Linux and macOS compiler.
  native-hosts:
    needs: [resolve, download, windows-host]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep one canary enabled until the native build passes end-to-end.
          - { rid: linux-x64, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: verified-upstream
          path: artifacts/upstream
      - uses: actions/download-artifact@v8.0.1
        with:
          name: windows-stage
          path: artifacts/stage
      - if: runner.os == 'Linux'
        name: Install Linux compiler prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential file libc6-dev zlib1g-dev
      - name: Install the hash-pinned build tool
        run: python -m pip install --require-hashes -r requirements-build.txt
      - name: Build twice and require identical compiler bytes
        run: python -m build_tools.ci_cli --upstream-config "${{ needs.resolve.outputs.upstream-config }}" --toolset-version "${{ needs.resolve.outputs.toolset-version }}" native-build-twice --archive "artifacts/upstream/${{ needs.resolve.outputs.source-archive }}" --data-root artifacts/stage/common --rid '${{ matrix.rid }}' --first artifacts/native-1 --second artifacts/native-2 --work artifacts/native-work
      - name: Add the native host and compile through the root launcher
        run: python -m build_tools.ci_cli --upstream-config "${{ needs.resolve.outputs.upstream-config }}" --toolset-version "${{ needs.resolve.outputs.toolset-version }}" native-smoke --rid '${{ matrix.rid }}' --binary artifacts/native-1/makensis --metadata artifacts/native-1/build-metadata.json --stage artifacts/stage --fixture fixtures/minimal.nsi --smoke artifacts/smoke
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: host-${{ matrix.rid }}
          path: artifacts/native-1
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: installer-${{ matrix.rid }}
          path: artifacts/smoke/smoke-installer.exe
          if-no-files-found: error
          retention-days: 2

  # Install and uninstall every host-generated smoke installer on Windows.
  install-test:
    needs: [windows-host, native-hosts]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: installer-*
          path: artifacts/installers
      - name: Install, verify, and uninstall the Windows x86 smoke package
        run: python -m build_tools.ci_cli test-installer --installer artifacts/installers/installer-win-x86/smoke-installer.exe --install-root artifacts/installed/win-x86
      - name: Install, verify, and uninstall the Linux x64 smoke package
        run: python -m build_tools.ci_cli test-installer --installer artifacts/installers/installer-linux-x64/smoke-installer.exe --install-root artifacts/installed/linux-x64

  # Assemble and validate reproducible release assets on Linux.
  assemble:
    # A complete package requires every native host. Re-enable this together
    # with the full native matrix after the Linux x64 canary passes.
    if: ${{ false }}
    needs: [resolve, windows-host, native-hosts, install-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: windows-stage
          path: artifacts/stage
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: host-*
          path: artifacts/hosts
      - name: Run the Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Assemble metadata and package twice with identical ZIP bytes
        run: python -m build_tools.ci_cli --upstream-config "${{ needs.resolve.outputs.upstream-config }}" --toolset-version "${{ needs.resolve.outputs.toolset-version }}" assemble --stage artifacts/stage --hosts artifacts/hosts --artifacts artifacts --source-commit "$GITHUB_SHA"
      - name: Validate the final package after relocation to a path with spaces
        run: python -m build_tools.ci_cli --upstream-config "${{ needs.resolve.outputs.upstream-config }}" --toolset-version "${{ needs.resolve.outputs.toolset-version }}" release-package-smoke --archive "artifacts/dist/nsis-toolset-${{ needs.resolve.outputs.toolset-version }}.zip" --destination "artifacts/release package" --smoke "artifacts/release package smoke" --fixture fixtures/minimal.nsi
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-assets
          path: artifacts/dist
          if-no-files-found: error
          retention-days: 14

  # Publish only assets validated from a matching pushed version tag.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [resolve, assemble]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-assets
          path: artifacts/dist
      - name: Revalidate the tag and publish immutable versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m build_tools.ci_cli --upstream-config "${{ needs.resolve.outputs.upstream-config }}" --toolset-version "${{ needs.resolve.outputs.toolset-version }}" publish --dist artifacts/dist
