name: build-and-verify

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      toolset-version:
        description: 'For example v3.12-r1 or v3.12-preview.2'
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  # 校验 tag 或手动输入，并解析工具集版本、上游版本和对应配置。
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      toolset-version: ${{ steps.version.outputs.toolsetVersion }}
      upstream-version: ${{ steps.version.outputs.upstreamVersion }}
      upstream-config: ${{ steps.version.outputs.upstreamConfig }}
      source-date-epoch: ${{ steps.version.outputs.sourceDateEpoch }}
      windows-archive: ${{ steps.version.outputs.windowsArchive }}
      source-archive: ${{ steps.version.outputs.sourceArchive }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - id: version
        name: Validate tag/input and resolve upstream configuration
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.toolset-version || github.ref_name }}
        run: python scripts/toolset.py resolve-version --version "$REQUESTED_VERSION" --github-output "$GITHUB_OUTPUT"

  # 只下载并校验一次官方归档，供后续各平台 job 复用。
  upstream:
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Download and verify upstream archives once
        run: python scripts/toolset.py --upstream-config "${{ needs.resolve.outputs.upstream-config }}" --toolset-version "${{ needs.resolve.outputs.toolset-version }}" download --cache artifacts/upstream
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: verified-upstream
          path: artifacts/upstream
          if-no-files-found: error
          retention-days: 2

  # 提取公共 NSIS 数据和官方 Windows x86 编译器，并执行 Windows 冒烟测试。
  windows-common:
    needs: [resolve, upstream]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: verified-upstream
          path: artifacts/upstream
      - name: Stage common files and official x86 Windows compiler
        run: python scripts/ci.py --upstream-config "${{ needs.resolve.outputs.upstream-config }}" --toolset-version "${{ needs.resolve.outputs.toolset-version }}" windows-stage-smoke --archive "artifacts/upstream/${{ needs.resolve.outputs.windows-archive }}" --stage artifacts/stage --work artifacts/work --fixture fixtures/minimal.nsi --smoke artifacts/smoke
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-stage
          path: artifacts/stage
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: installer-win-x86
          path: artifacts/smoke/smoke-installer.exe
          if-no-files-found: error
          retention-days: 2

  # 在 Linux/macOS 架构矩阵中构建原生编译器，检查可复现性并执行冒烟测试。
  native-hosts:
    needs: [resolve, upstream]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-24.04 }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx-x64, os: macos-15-intel }
          - { rid: osx-arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: verified-upstream
          path: artifacts/upstream
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential file libc6-dev zlib1g-dev
      - run: python -m pip install --require-hashes -r requirements-build.txt
      - name: Build twice and require identical compiler bytes
        run: python scripts/ci.py --upstream-config "${{ needs.resolve.outputs.upstream-config }}" --toolset-version "${{ needs.resolve.outputs.toolset-version }}" native-build-twice --archive "artifacts/upstream/${{ needs.resolve.outputs.source-archive }}" --rid '${{ matrix.rid }}' --first artifacts/native-1 --second artifacts/native-2
      - name: Compile through both direct binary and root dispatcher
        run: python scripts/ci.py --upstream-config "${{ needs.resolve.outputs.upstream-config }}" --toolset-version "${{ needs.resolve.outputs.toolset-version }}" native-smoke --archive "artifacts/upstream/${{ needs.resolve.outputs.windows-archive }}" --rid '${{ matrix.rid }}' --binary artifacts/native-1/makensis --metadata artifacts/native-1/build-metadata.json --stage artifacts/smoke-stage --work artifacts/extract --fixture fixtures/minimal.nsi --smoke artifacts/smoke
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: host-${{ matrix.rid }}
          path: artifacts/native-1
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: installer-${{ matrix.rid }}
          path: artifacts/smoke/smoke-installer.exe
          if-no-files-found: error
          retention-days: 2

  # 汇总全部宿主文件，生成并验证确定性发布包及来源记录。
  assemble:
    needs: [resolve, windows-common, native-hosts]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: windows-stage
          path: artifacts/stage
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: host-*
          path: artifacts/hosts
      - name: Assemble deterministic ZIP and external provenance
        run: python scripts/ci.py --upstream-config "${{ needs.resolve.outputs.upstream-config }}" --toolset-version "${{ needs.resolve.outputs.toolset-version }}" assemble --stage artifacts/stage --hosts artifacts/hosts --artifacts artifacts --source-commit "$GITHUB_SHA"
      - name: Verify relocated ZIP
        run: python scripts/ci.py --upstream-config "${{ needs.resolve.outputs.upstream-config }}" --toolset-version "${{ needs.resolve.outputs.toolset-version }}" relocated-smoke --archive "artifacts/dist/nsis-toolset-${{ needs.resolve.outputs.toolset-version }}.zip" --destination "artifacts/relocated toolset" --smoke "artifacts/relocated smoke" --fixture fixtures/minimal.nsi
      - run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-assets
          path: artifacts/dist
          if-no-files-found: error
          retention-days: 14

  # 在 Windows 上逐一运行各宿主生成的安装器，并验证静默安装和卸载。
  install-uninstall:
    needs: [assemble, windows-common, native-hosts]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: installer-*
          path: artifacts/installers
      - name: Run every host-generated installer and uninstaller
        run: python scripts/ci.py install-uninstall --installers artifacts/installers --expected-count 5

  # 仅在合法 tag 推送时，将已验证资产发布到对应的 GitHub Release。
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [resolve, assemble, install-uninstall]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-assets
          path: artifacts/dist
      - name: Publish immutable versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci.py --upstream-config "${{ needs.resolve.outputs.upstream-config }}" --toolset-version "${{ needs.resolve.outputs.toolset-version }}" publish --dist artifacts/dist
