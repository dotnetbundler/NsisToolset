name: build-and-verify

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      toolset-version:
        description: 'For example v3.12-r1 or v3.12-preview.2'
        required: true
        default: 'v3.12-test'
        type: string

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  # Resolve the requested version, then download and verify its upstream files.
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      toolset-version: ${{ steps.version.outputs.toolsetVersion }}
      upstream-config: ${{ steps.version.outputs.upstreamConfig }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - id: version
        name: Resolve version and upstream configuration
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.toolset-version || github.ref_name }}
        run: python -m build_tools.toolset_cli resolve-version --version "$REQUESTED_VERSION" --github-output "$GITHUB_OUTPUT"
      - name: Download and verify upstream files
        run: python -m build_tools.toolset_cli --upstream-config "${{ steps.version.outputs.upstreamConfig }}" --toolset-version "${{ steps.version.outputs.toolsetVersion }}" download --cache artifacts/upstream
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: verified-upstream
          path: artifacts/upstream
          if-no-files-found: error
          retention-days: 2

  # Stage common data and smoke-test all five hosts in parallel.
  hosts-smoke:
    name: Host smoke (${{ matrix.rid }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x86, os: windows-2022 }
          - { rid: linux-x64, os: ubuntu-24.04 }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx-x64, os: macos-15-intel }
          - { rid: osx-arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: verified-upstream
          path: artifacts/upstream
      - name: Build and smoke-test the host
        run: python -m build_tools.ci_cli --upstream-config "${{ needs.prepare.outputs.upstream-config }}" --toolset-version "${{ needs.prepare.outputs.toolset-version }}" host-smoke --cache artifacts/upstream --rid '${{ matrix.rid }}' --artifacts artifacts --fixture fixtures/minimal.nsi
      - if: matrix.rid == 'win-x86'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-stage
          path: artifacts/stage
          if-no-files-found: error
          retention-days: 2
      - if: matrix.rid != 'win-x86'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: host-${{ matrix.rid }}
          path: artifacts/native-1
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: installer-${{ matrix.rid }}
          path: artifacts/smoke/smoke-installer.exe
          if-no-files-found: error
          retention-days: 2

  # Every host emits a Windows installer, so installation is checked on Windows.
  installer-smoke:
    name: Installer smoke
    needs: hosts-smoke
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: installer-*
          path: artifacts/installers
      - name: Install, verify, and uninstall the Windows x86 smoke package
        run: python -m build_tools.ci_cli test-installer --installer artifacts/installers/installer-win-x86/smoke-installer.exe --install-root artifacts/installed/win-x86
      - name: Install, verify, and uninstall the Linux x64 smoke package
        run: python -m build_tools.ci_cli test-installer --installer artifacts/installers/installer-linux-x64/smoke-installer.exe --install-root artifacts/installed/linux-x64
      - name: Install, verify, and uninstall the Linux ARM64 smoke package
        run: python -m build_tools.ci_cli test-installer --installer artifacts/installers/installer-linux-arm64/smoke-installer.exe --install-root artifacts/installed/linux-arm64
      - name: Install, verify, and uninstall the macOS x64 smoke package
        run: python -m build_tools.ci_cli test-installer --installer artifacts/installers/installer-osx-x64/smoke-installer.exe --install-root artifacts/installed/osx-x64
      - name: Install, verify, and uninstall the macOS ARM64 smoke package
        run: python -m build_tools.ci_cli test-installer --installer artifacts/installers/installer-osx-arm64/smoke-installer.exe --install-root artifacts/installed/osx-arm64

  # Assemble once all smoke checks pass; publish in-place only for version tags.
  assemble-and-release:
    needs: [prepare, hosts-smoke, installer-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: windows-stage
          path: artifacts/stage
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: host-*
          path: artifacts/hosts
      - name: Run the Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Assemble and package twice with identical ZIP bytes
        run: python -m build_tools.ci_cli --upstream-config "${{ needs.prepare.outputs.upstream-config }}" --toolset-version "${{ needs.prepare.outputs.toolset-version }}" assemble --stage artifacts/stage --hosts artifacts/hosts --artifacts artifacts
      - name: Validate the final package after relocation to a path with spaces
        run: python -m build_tools.ci_cli --upstream-config "${{ needs.prepare.outputs.upstream-config }}" --toolset-version "${{ needs.prepare.outputs.toolset-version }}" release-package-smoke --archive "artifacts/dist/nsis-toolset-${{ needs.prepare.outputs.toolset-version }}.zip" --destination "artifacts/release package" --smoke "artifacts/release package smoke" --fixture fixtures/minimal.nsi
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-assets
          path: artifacts/dist
          if-no-files-found: error
          retention-days: 14
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        name: Revalidate the tag and publish immutable versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m build_tools.ci_cli --upstream-config "${{ needs.prepare.outputs.upstream-config }}" --toolset-version "${{ needs.prepare.outputs.toolset-version }}" publish --dist artifacts/dist
