name: build-and-verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  TOOLSET_VERSION: 3.12-r1
  SOURCE_DATE_EPOCH: '1776631488'

jobs:
  upstream:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/toolset.py download --cache artifacts/upstream
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-upstream
          path: artifacts/upstream
          if-no-files-found: error
          retention-days: 2

  windows-common:
    needs: upstream
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-upstream
          path: artifacts/upstream
      - shell: pwsh
        run: |
          python scripts/toolset.py stage-windows --archive artifacts/upstream/nsis-3.12.zip --stage stage --work artifacts/work
          $version = & stage/hosts/win/makensis.cmd -VERSION
          if ($version -ne 'v3.12') { throw "Unexpected version: $version" }
          New-Item -ItemType Directory artifacts/smoke | Out-Null
          Copy-Item fixtures/minimal.nsi artifacts/smoke/
          Push-Location artifacts/smoke
          & ../../stage/hosts/win/makensis.cmd minimal.nsi
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path smoke-installer.exe)) { throw 'Windows compiler smoke test failed' }
          Pop-Location
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-stage
          path: stage
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-win-x64
          path: artifacts/smoke/smoke-installer.exe
          if-no-files-found: error
          retention-days: 2

  native-hosts:
    needs: upstream
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-x64
            os: macos-15-intel
          - rid: osx-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-upstream
          path: artifacts/upstream
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential file libc6-dev zlib1g-dev
      - run: python -m pip install --require-hashes -r requirements-build.txt
      - name: Build twice and require identical native compiler bytes
        run: |
          bash scripts/build-posix.sh artifacts/upstream/nsis-3.12-src.tar.bz2 artifacts/native-1 '${{ matrix.rid }}' "$SOURCE_DATE_EPOCH"
          bash scripts/build-posix.sh artifacts/upstream/nsis-3.12-src.tar.bz2 artifacts/native-2 '${{ matrix.rid }}' "$SOURCE_DATE_EPOCH"
          cmp artifacts/native-1/makensis.bin artifacts/native-2/makensis.bin
      - name: Compile with the relocatable common/host layout
        run: |
          python scripts/toolset.py stage-windows --archive artifacts/upstream/nsis-3.12.zip --stage artifacts/smoke-stage --work artifacts/extract
          python scripts/toolset.py stage-host --stage artifacts/smoke-stage --rid '${{ matrix.rid }}' --binary artifacts/native-1/makensis.bin --metadata artifacts/native-1/build-metadata.json
          mkdir -p artifacts/smoke
          cp fixtures/minimal.nsi artifacts/smoke/
          cd artifacts/smoke
          "../smoke-stage/hosts/${{ matrix.rid }}/makensis" minimal.nsi
          test -f smoke-installer.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: host-${{ matrix.rid }}
          path: artifacts/native-1
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ matrix.rid }}
          path: artifacts/smoke/smoke-installer.exe
          if-no-files-found: error
          retention-days: 2

  assemble:
    needs: [windows-common, native-hosts]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-stage
          path: stage
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: host-*
          path: artifacts/hosts
      - name: Assemble, inventory, and package
        run: |
          for rid in linux-x64 linux-arm64 osx-x64 osx-arm64; do
            python scripts/toolset.py stage-host --stage stage --rid "$rid" \
              --binary "artifacts/hosts/host-$rid/makensis.bin" \
              --metadata "artifacts/hosts/host-$rid/build-metadata.json"
          done
          python scripts/provenance.py --metadata-root artifacts/hosts --output stage/build-provenance.json
          cp SOURCES.md stage/SOURCE-RECORD.md
          cp stage/build-provenance.json artifacts/build-provenance.json
          python scripts/toolset.py manifest --stage stage --provenance stage/build-provenance.json
          python scripts/toolset.py verify --stage stage --repair-modes
          python scripts/toolset.py package --stage stage --dist dist
          cp artifacts/build-provenance.json dist/build-provenance.json
          cp stage/SOURCE-RECORD.md dist/source-record.md
      - name: Verify ZIP after extraction in a path containing spaces
        run: |
          python scripts/toolset.py verify-zip --archive "dist/nsis-toolset-$TOOLSET_VERSION.zip" --destination "artifacts/relocated toolset"
          mkdir -p "artifacts/relocated smoke"
          cp fixtures/minimal.nsi "artifacts/relocated smoke/"
          cd "artifacts/relocated smoke"
          "../relocated toolset/hosts/linux-x64/makensis" minimal.nsi
          test -f smoke-installer.exe
      - run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist
          if-no-files-found: error
          retention-days: 14

  install-uninstall:
    needs: [assemble, windows-common, native-hosts]
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installer-*
          path: installers
      - name: Run every host-generated installer and its uninstaller
        shell: pwsh
        run: |
          $installers = Get-ChildItem installers -Recurse -Filter smoke-installer.exe
          if ($installers.Count -ne 5) { throw "Expected 5 installers, found $($installers.Count)" }
          foreach ($installer in $installers) {
            Remove-Item "$env:TEMP/NsisToolsetSmoke" -Recurse -Force -ErrorAction SilentlyContinue
            $process = Start-Process $installer.FullName -ArgumentList '/S' -Wait -PassThru
            if ($process.ExitCode -ne 0 -or -not (Test-Path "$env:TEMP/NsisToolsetSmoke/installed.txt")) { throw "Install failed: $($installer.FullName)" }
            $uninstaller = "$env:TEMP/NsisToolsetSmoke/uninstall.exe"
            $process = Start-Process $uninstaller -ArgumentList '/S' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Uninstall failed: $($installer.FullName)" }
            $deadline = (Get-Date).AddSeconds(10)
            while ((Test-Path "$env:TEMP/NsisToolsetSmoke") -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
            if (Test-Path "$env:TEMP/NsisToolsetSmoke") { throw "Uninstall left files: $($installer.FullName)" }
          }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: install-uninstall
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Publish immutable versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v$TOOLSET_VERSION"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "NSIS Toolset $TOOLSET_VERSION" \
            --notes "Audited cross-host NSIS $TOOLSET_VERSION toolset. See README and build-provenance.json."
